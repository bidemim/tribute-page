<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribute Page</title>
</head>
<body>
    <main id="main">
        <h1 id="title">Chimamanda Ngozi Adichie</h1>
        <figure id="img-div">
            <img id="image"
                src="./assets/images/Chimamanda-Ngozi-Adichie.jpg"
                alt="Chimamanda receiving an award on a stage, 
                she wears a black dress with white sleeves.">
            <figcaption id="img-caption">
                Author of The Feminist Manifesto - Chimamanda Ngozi Adichie, receiving an award on a stage
            </figcaption>
        <p id="tribute-info">
             She is the author of several novels, including Purple Hibiscus (2003), Half of a Yellow Sun (2006), 
             Americanah (2013), and Dream Count (2025), of a short story collection, The Thing around Your Neck 
             (2009), and of three books of non-fiction, We Should All Be Feminists (2014), Dear Ijeawele, or A 
             Feminist Manifesto in Fifteen Suggestions (2017), and Notes on Grief (2021).
        </p>
        </figure>
    </main>
</body>
</html>
